name: Generate matchup commentary

# Monday once the new AP poll has settled, and Friday once the lines have
# firmed up. Monday runs BEFORE the weekly email (14:00) on purpose: the email
# reuses this column, and a column written for last week's slate is discarded.
on:
  schedule:
    - cron: '0 13 * * 1'   # Mon 13:00 UTC = 9am ET
    - cron: '0 15 * * 5'   # Fri 15:00 UTC = 11am ET
  workflow_dispatch:        # manual run from the Actions tab
    inputs:
      model:
        description: 'Model id (blank = claude-opus-5)'
        required: false
        default: ''
      no_write:
        description: 'Generate and print, but do not publish (safe model trials)'
        type: boolean
        default: false

concurrency:
  group: commentary
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate commentary
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ inputs.model }}
          NO_WRITE: ${{ inputs.no_write && '1' || '0' }}
        run: node scripts/generate-commentary.mjs

      - name: Commit if changed
        run: |
          # git status (not git diff) — on the very first run commentary.json is
          # untracked, and git diff reports no change for untracked files.
          if [ -z "$(git status --porcelain commentary.json)" ]; then
            echo "no change — nothing to commit"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add commentary.json
          git commit -m "Update matchup commentary [skip ci]"
          git push
