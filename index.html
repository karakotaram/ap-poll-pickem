<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="College football AP Poll pick'em pool standings and payouts.">
<title>AP Poll Pick'em</title>
<style>
:root{
  color-scheme: light;
  --plane:#f9f9f7; --surface:#fcfcfb; --surface-2:#f2f1ed;
  --ink:#0b0b0b; --ink-2:#52514e; --muted:#898781;
  --grid:#e1e0d9; --axis:#c3c2b7; --border:rgba(11,11,11,.10);
  --good:#006300; --bad:#d03b3b; --warn:#fab219;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100;
  --s5:#e87ba4; --s6:#008300; --s7:#4a3aa7; --s8:#e34948;
  --shadow:0 1px 2px rgba(11,11,11,.05), 0 4px 12px rgba(11,11,11,.04);
}
@media (prefers-color-scheme: dark){
  :root:where(:not([data-theme="light"])){
    color-scheme: dark;
    --plane:#0d0d0d; --surface:#1a1a19; --surface-2:#232322;
    --ink:#fff; --ink-2:#c3c2b7; --muted:#898781;
    --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,.10);
    --good:#0ca30c; --bad:#e66767;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
    --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 4px 12px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --plane:#0d0d0d; --surface:#1a1a19; --surface-2:#232322;
  --ink:#fff; --ink-2:#c3c2b7; --muted:#898781;
  --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,.10);
  --good:#0ca30c; --bad:#e66767;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
  --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 4px 12px rgba(0,0,0,.3);
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:var(--plane); color:var(--ink);
  font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased; padding:0 0 64px;
}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}

/* ---------- header ---------- */
header{padding:28px 0 20px;border-bottom:1px solid var(--border);margin-bottom:24px}
.hrow{display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap}
h1{font-size:26px;font-weight:680;letter-spacing:-.02em;line-height:1.15}
.sub{color:var(--ink-2);font-size:13.5px;margin-top:3px}
.hspace{flex:1 1 auto}
.ctrls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
select,.btn{
  font:inherit;font-size:13px;color:var(--ink);background:var(--surface);
  border:1px solid var(--border);border-radius:8px;padding:7px 10px;cursor:pointer;
}
select:hover,.btn:hover{background:var(--surface-2)}
.btn.icon{width:34px;padding:0;height:33px;display:grid;place-items:center;font-size:15px}

/* ---------- leader banner ---------- */
.banner{
  display:flex;gap:14px;align-items:center;flex-wrap:wrap;
  background:var(--surface);border:1px solid var(--border);border-radius:12px;
  padding:14px 18px;margin-bottom:20px;box-shadow:var(--shadow)
}
.bstat{display:flex;flex-direction:column;gap:1px;padding-right:18px}
.bstat + .bstat{border-left:1px solid var(--border);padding-left:18px}
.blabel{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.bval{font-size:21px;font-weight:660;letter-spacing:-.01em}
.bval.sm{font-size:15px;font-weight:600}

/* ---------- key matchups ---------- */
.mzone{margin-bottom:22px}
.mzhead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;padding:0 2px 10px}
.mztitle{font-size:15px;font-weight:620}
.mzgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.mu{background:var(--surface);border:1px solid var(--border);border-radius:12px;
    box-shadow:var(--shadow);padding:14px 16px 15px;display:flex;flex-direction:column;gap:11px}
.muhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.murk{font-size:11px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--muted);
      border:1px solid var(--border);border-radius:5px;width:19px;height:19px;
      display:grid;place-items:center;flex:none}
.mutag{font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
       padding:2.5px 7px;border-radius:999px;border:1px solid var(--border);color:var(--ink-2);background:var(--surface-2)}
.mutag.h2h{color:var(--s8);border-color:color-mix(in srgb,var(--s8) 40%,transparent);
           background:color-mix(in srgb,var(--s8) 8%,transparent)}
.mutag.live{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 45%,transparent)}
.muwhen{margin-left:auto;font-size:11.5px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.muteams{display:flex;flex-direction:column;gap:1px}
.mut{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:7px;font-size:13.5px}
.mut.own{background:var(--surface-2)}
.mut.lost{opacity:.5}
.mursk{font-size:10.5px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--muted);
       width:30px;flex:none;text-align:right}
.muname{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.murec{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;flex:none}
.muown{margin-left:auto;display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--ink-2);flex:none}
.muown.free{color:var(--muted);font-style:italic}
.mupts{font-size:13px;font-weight:660;font-variant-numeric:tabular-nums;width:22px;text-align:right;flex:none}
.musc{font-size:14px;font-weight:680;font-variant-numeric:tabular-nums;width:26px;text-align:right;flex:none}
.mumeta{font-size:11.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:5px 9px;
        border-top:1px solid var(--grid);padding-top:9px}
.mumeta b{color:var(--ink-2);font-weight:640}
.mubody{font-size:13px;line-height:1.55;color:var(--ink-2)}
.mubody em{color:var(--ink);font-style:normal;font-weight:600}

/* ---------- tabs ---------- */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);margin-bottom:22px;overflow-x:auto}
.tab{
  font:inherit;font-size:14px;font-weight:550;color:var(--ink-2);background:none;border:none;
  padding:10px 14px;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;margin-bottom:-1px
}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--s1)}
.panel[hidden]{display:none}

/* ---------- cards & tables ---------- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);overflow:hidden}
.card + .card{margin-top:18px}
.chead{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.ctitle{font-size:15px;font-weight:620}
.cnote{font-size:12.5px;color:var(--muted)}
table{width:100%;border-collapse:collapse}
th{
  text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;
  color:var(--muted);font-weight:600;padding:9px 14px;border-bottom:1px solid var(--border);white-space:nowrap
}
td{padding:10px 14px;border-bottom:1px solid var(--grid);vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
.num{text-align:right;font-variant-numeric:tabular-nums}

/* standings */
.strow{cursor:pointer}
.strow:hover{background:var(--surface-2)}
.place{font-variant-numeric:tabular-nums;color:var(--muted);font-weight:600;width:34px}
.place.p1{color:var(--ink)}
.pname{display:flex;align-items:center;gap:9px;font-weight:600}
.swatch{width:9px;height:9px;border-radius:2px;flex:none}
.pts{font-size:17px;font-weight:660;font-variant-numeric:tabular-nums}
.delta{font-size:12.5px;font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap}
.delta.up{color:var(--good)} .delta.dn{color:var(--bad)}
.chev{color:var(--muted);font-size:11px;width:14px;display:inline-block;transition:transform .15s}
.strow.open .chev{transform:rotate(90deg)}
.detail td{background:var(--surface-2);padding:4px 14px 14px}
.picks{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:7px;padding-top:10px}
.pick{
  display:flex;align-items:center;gap:9px;background:var(--surface);
  border:1px solid var(--border);border-radius:8px;padding:7px 10px;font-size:13px
}
.pick.zero{opacity:.55}
.prank{
  font-size:11px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--surface);
  background:var(--ink-2);border-radius:4px;padding:2px 5px;min-width:24px;text-align:center;flex:none
}
.prank.rv{background:var(--muted)}
.prank.none{background:transparent;color:var(--muted);border:1px dashed var(--axis)}
.pteam{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ppts{font-variant-numeric:tabular-nums;font-weight:640;color:var(--ink-2);flex:none}

/* payouts */
.paygrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:18px}
.pill{
  display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
  padding:2.5px 7px;border-radius:999px;border:1px solid var(--border);color:var(--ink-2);background:var(--surface-2)
}
.pill.live{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 40%,transparent)}
.pill.locked{color:var(--good);border-color:color-mix(in srgb,var(--good) 40%,transparent)}
.money{font-variant-numeric:tabular-nums;font-weight:640}
.money.pos{color:var(--good)} .money.neg{color:var(--bad)}
.medal{width:22px;display:inline-block;font-variant-numeric:tabular-nums;color:var(--muted);font-weight:600}

/* chart */
.chartbox{padding:16px 8px 8px;position:relative}
svg.chart{display:block;width:100%;height:auto;overflow:visible}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;padding:2px 18px 16px}
.lgi{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink-2);cursor:pointer;user-select:none}
.lgi.off{opacity:.35}
.lgsw{width:11px;height:3px;border-radius:2px;flex:none}
.tip{
  position:absolute;pointer-events:none;opacity:0;transition:opacity .1s;
  background:var(--surface);border:1px solid var(--border);border-radius:9px;
  box-shadow:var(--shadow);padding:9px 11px;font-size:12.5px;min-width:150px;z-index:5
}
.tip b{display:block;font-size:12px;color:var(--muted);font-weight:600;
  text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px}
.tiprow{display:flex;align-items:center;gap:7px;line-height:1.7}
.tiprow .nm{flex:1;color:var(--ink-2)}
.tiprow .vl{font-variant-numeric:tabular-nums;font-weight:640}

/* board */
.boardgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px}
.brow{display:flex;align-items:center;gap:10px;padding:7px 14px;border-bottom:1px solid var(--grid);font-size:13.5px}
.brow:last-child{border-bottom:none}
.brank{font-variant-numeric:tabular-nums;font-weight:660;color:var(--muted);width:26px;flex:none;text-align:right}
.bteam{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.owner{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-2);flex:none}
.owner.free{color:var(--muted);font-style:italic}
.bpts{font-variant-numeric:tabular-nums;font-weight:640;width:30px;text-align:right;flex:none;color:var(--ink-2)}

/* misc */
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;padding:14px 18px}
.rule{background:var(--surface-2);border-radius:8px;padding:8px 10px;font-size:12.5px;color:var(--ink-2)}
.rule b{display:block;font-size:15px;color:var(--ink);font-weight:660;font-variant-numeric:tabular-nums}
.status{font-size:12.5px;color:var(--muted);padding:10px 0 0}
.err{color:var(--bad)}
.empty{padding:26px 18px;color:var(--muted);font-size:13.5px;text-align:center}
.tblwrap{overflow-x:auto}
@media (max-width:560px){
  .bstat{padding-right:12px} .bstat + .bstat{padding-left:12px}
  h1{font-size:22px}
}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="hrow">
    <div>
      <h1>AP Poll Pick&rsquo;em</h1>
      <div class="sub" id="subtitle">8-team pool &middot; loading&hellip;</div>
    </div>
    <div class="hspace"></div>
    <div class="ctrls">
      <select id="pollSel" aria-label="Select poll"></select>
      <button class="btn icon" id="themeBtn" title="Toggle theme" aria-label="Toggle theme">◐</button>
    </div>
  </div>
</header>

<div class="banner" id="banner"></div>

<section class="mzone" id="matchups"></section>

<div class="tabs" role="tablist">
  <button class="tab" role="tab" aria-selected="true"  data-p="standings">Standings</button>
  <button class="tab" role="tab" aria-selected="false" data-p="payouts">Payouts</button>
  <button class="tab" role="tab" aria-selected="false" data-p="history">History</button>
  <button class="tab" role="tab" aria-selected="false" data-p="board">Big Board</button>
</div>

<section class="panel" id="p-standings"></section>
<section class="panel" id="p-payouts" hidden></section>
<section class="panel" id="p-history" hidden></section>
<section class="panel" id="p-board" hidden></section>

<div class="status" id="status"></div>
</div>

<script>
"use strict";
/* ==================================================================
   AP Poll Pick'em  —  self-contained static site
   Poll data: ESPN public rankings API (no key, CORS-open)
   ================================================================== */

const DATA   = JSON.parse(document.getElementById('payload').textContent);
const TEAMS  = DATA.teams;          // id -> [name, abbr, color]
const ROSTER = DATA.roster;         // [{name, slot, picks:[teamId...]}]
const SEED   = DATA.seed;           // fallback poll if the network fails

const BUYIN = 200;
const POOL  = BUYIN * ROSTER.length;                 // $1,600
const PRE   = { pct:.40, prizes:[400,160,80]  };     // final poll BEFORE playoffs
const POST  = { pct:.60, prizes:[600,240,120] };     // final poll AFTER playoffs
const SERIES = ROSTER.map(p => `var(--s${p.slot})`);

/* ---------- season: ESPN season N runs Feb N -> Jan N+1 ---------- */
const qs = new URLSearchParams(location.search);
const NOW = new Date();
const SEASON = +(qs.get('season') || (NOW.getMonth() >= 1 ? NOW.getFullYear() : NOW.getFullYear()-1));

/* ---------- scoring ---------- */
function pointsForRank(r){
  if(r === 1)  return 25;
  if(r <= 6)   return 20;
  if(r <= 10)  return 15;
  if(r <= 15)  return 10;
  if(r <= 20)  return 5;
  if(r <= 24)  return 3;
  if(r === 25) return 2;
  return 0;
}
const RV_BONUS = 2, RV_SLOTS = 3;   // top 3 "others receiving votes" -> 2 pts

/* Build teamId -> {pts, rank, votes, kind} for one poll */
function scoreMap(poll){
  const m = new Map();
  poll.ranks.forEach(r => m.set(r.id, {pts:pointsForRank(r.rank), rank:r.rank, votes:r.votes, kind:'ranked'}));
  poll.others.slice(0, RV_SLOTS).forEach((o,i) => {
    if(!m.has(o.id)) m.set(o.id, {pts:RV_BONUS, rank:null, votes:o.votes, kind:'rv', rvPlace:i+1});
  });
  return m;
}

/* Standings for one poll, sorted, with tie-aware places */
function standings(poll){
  const sm = scoreMap(poll);
  const rows = ROSTER.map(p => {
    const teams = p.picks.map(id => Object.assign({id}, sm.get(id) || {pts:0, rank:null, votes:0, kind:'none'}));
    teams.sort((a,b) => b.pts - a.pts || (a.rank||99) - (b.rank||99) || (b.votes||0)-(a.votes||0));
    return {name:p.name, slot:p.slot, teams, total:teams.reduce((s,t) => s + t.pts, 0)};
  });
  rows.sort((a,b) => b.total - a.total || a.name.localeCompare(b.name));
  let place = 1;
  rows.forEach((r,i) => { if(i && r.total !== rows[i-1].total) place = i+1; r.place = place; });
  return rows;
}

/* Prize split: tied players share the sum of the places they occupy */
function payout(rows, prizes){
  const out = {};
  const groups = [];
  rows.forEach(r => {
    const g = groups[groups.length-1];
    if(g && g.total === r.total) g.members.push(r);
    else groups.push({total:r.total, members:[r]});
  });
  let idx = 0;
  groups.forEach(g => {
    let sum = 0;
    for(let i = idx; i < idx + g.members.length; i++) sum += prizes[i] || 0;
    const each = sum / g.members.length;
    g.members.forEach(m => out[m.name] = each);
    idx += g.members.length;
  });
  return out;
}

/* ---------- ESPN fetch ---------- */
const BASE = 'https://sports.core.api.espn.com/v2/sports/football/leagues/college-football/seasons';
const SLOTS = [{t:1,w:1}];
for(let w = 1; w <= 17; w++) SLOTS.push({t:2, w});
SLOTS.push({t:3, w:1});

const refId = ref => { const m = /teams\/(\d+)/.exec(ref || ''); return m ? m[1] : null; };

function normalize(d, t, w){
  const ranks = (d.ranks || []).map(r => ({id:refId(r.team && r.team.$ref), rank:r.current, votes:r.points || 0}))
                               .filter(x => x.id && TEAMS[x.id]);
  if(!ranks.length) return null;
  const others = (d.others || []).map(o => ({id:refId(o.team && o.team.$ref), votes:o.points || 0}))
                                 .filter(x => x.id && TEAMS[x.id])
                                 .sort((a,b) => b.votes - a.votes);
  return {type:t, week:w, order:t*100 + w,
          label:(d.occurrence && d.occurrence.displayValue) || `Week ${w}`,
          ranks, others};
}

async function fetchSlot(t, w){
  try{
    const r = await fetch(`${BASE}/${SEASON}/types/${t}/weeks/${w}/rankings/1`, {cache:'no-store'});
    if(!r.ok) return null;
    return normalize(await r.json(), t, w);
  }catch(e){ return null; }
}

// Bump SCHEMA whenever the cached object shape changes, so a deploy can't leave
// users rendering stale data that's missing newly-added fields.
const SCHEMA = 'v2';
const CACHE_KEY = `appickem:${SCHEMA}:${SEASON}`;
const CACHE_TTL = 30 * 60 * 1000;   // 30 min

try{   // drop caches written by an older schema
  Object.keys(localStorage)
    .filter(k => k.startsWith('appickem:') && k !== 'appickem:theme' && !k.startsWith(`appickem:${SCHEMA}:`))
    .forEach(k => localStorage.removeItem(k));
}catch(e){}

async function loadPolls(){
  // fast paint from cache
  try{
    const c = JSON.parse(localStorage.getItem(CACHE_KEY) || 'null');
    if(c && c.polls && c.polls.length){
      render(c.polls, true);
      if(Date.now() - c.at < CACHE_TTL){ setStatus(c.at, false); return c.polls; }
    }
  }catch(e){}

  const polls = (await Promise.all(SLOTS.map(s => fetchSlot(s.t, s.w)))).filter(Boolean);
  polls.sort((a,b) => a.order - b.order);

  if(!polls.length){
    const cached = JSON.parse(localStorage.getItem(CACHE_KEY) || 'null');
    if(cached && cached.polls && cached.polls.length){ setStatus(cached.at, true); return cached.polls; }
    render([Object.assign({order:101}, SEED)], false);
    setStatus(null, true);
    return null;
  }
  try{ localStorage.setItem(CACHE_KEY, JSON.stringify({at:Date.now(), polls})); }catch(e){}
  render(polls, false);
  setStatus(Date.now(), false);
  return polls;
}

function setStatus(at, offline){
  const el = document.getElementById('status');
  const when = at ? new Date(at).toLocaleString(undefined,{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}) : null;
  el.innerHTML = offline
    ? `<span class="err">Couldn&rsquo;t reach ESPN &mdash; showing ${when ? 'cached data from ' + when : 'the embedded preseason poll'}.</span>`
    : `Poll data from the ESPN public API &middot; updated ${when}. Polls post Sunday afternoons in-season.`;
}

/* ---------- rendering ---------- */
let POLLS = [], CUR = 0;
const el = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const tname = id => (TEAMS[id] ? TEAMS[id][0] : 'Team ' + id);
const usd = n => (n % 1 ? '$' + n.toFixed(2) : '$' + n.toLocaleString());
const slotOf = name => (ROSTER.find(p => p.name === name) || {slot:1}).slot;

function render(polls, partial){
  POLLS = polls;
  const want = qs.get('poll');
  CUR = want ? Math.min(+want, polls.length-1) : polls.length - 1;
  if(!partial || !el('pollSel').options.length) buildPollSelect();
  draw();
}

function buildPollSelect(){
  const s = el('pollSel');
  s.innerHTML = POLLS.map((p,i) => `<option value="${i}">${esc(p.label)}</option>`).join('');
  s.value = CUR;
  s.onchange = () => { CUR = +s.value; draw(); };
}

function draw(){
  const poll = POLLS[CUR];
  if(!poll) return;
  el('pollSel').value = CUR;
  const rows = standings(poll);
  const prev = CUR > 0 ? standings(POLLS[CUR-1]) : null;

  el('subtitle').textContent =
    `${ROSTER.length}-team pool · ${SEASON} season · ${poll.label} AP Poll · ${usd(POOL)} pot`;

  drawBanner(rows, prev, poll);
  drawStandings(rows, prev, poll);
  drawPayouts(rows);
  drawHistory();
  drawBoard(poll, rows);
  drawMatchups();
}

/* --- banner --- */
function drawBanner(rows, prev, poll){
  const lead = rows[0];
  const tiedTop = rows.filter(r => r.total === lead.total);
  const leadName = tiedTop.length > 1 ? tiedTop.map(r => r.name).join(' & ') : lead.name;
  const gap = rows.find(r => r.total < lead.total);
  el('banner').innerHTML = `
    <div class="bstat">
      <span class="blabel">Leader &mdash; ${esc(poll.label)}</span>
      <span class="bval">${esc(leadName)}</span>
    </div>
    <div class="bstat">
      <span class="blabel">Points</span>
      <span class="bval">${lead.total}</span>
    </div>
    <div class="bstat">
      <span class="blabel">Lead</span>
      <span class="bval sm">${gap ? '+' + (lead.total - gap.total) + ' pts' : '&mdash;'}</span>
    </div>
    <div class="bstat">
      <span class="blabel">Pot</span>
      <span class="bval sm">${usd(POOL)} &middot; ${usd(BUYIN)} each</span>
    </div>`;
}

/* --- standings --- */
function drawStandings(rows, prev, poll){
  const prevPlace = {};
  if(prev) prev.forEach(r => prevPlace[r.name] = r.place);

  const body = rows.map(r => {
    const mv = prev ? prevPlace[r.name] - r.place : 0;
    const mvHtml = !prev ? '<span class="delta">&mdash;</span>'
      : mv > 0 ? `<span class="delta up">&#9650; ${mv}</span>`
      : mv < 0 ? `<span class="delta dn">&#9660; ${-mv}</span>`
      : '<span class="delta">&ndash;</span>';
    const picks = r.teams.map(t => {
      const badge = t.kind === 'ranked' ? `<span class="prank">${t.rank}</span>`
                  : t.kind === 'rv'     ? `<span class="prank rv">RV${t.rvPlace}</span>`
                  : `<span class="prank none">&mdash;</span>`;
      return `<div class="pick${t.pts ? '' : ' zero'}">${badge}
                <span class="pteam">${esc(tname(t.id))}</span>
                <span class="ppts">${t.pts}</span></div>`;
    }).join('');
    return `
      <tr class="strow" data-n="${esc(r.name)}">
        <td class="place${r.place === 1 ? ' p1' : ''}">${r.place}</td>
        <td><span class="pname"><span class="chev">&#9656;</span>
            <span class="swatch" style="background:var(--s${r.slot})"></span>${esc(r.name)}</span></td>
        <td class="num pts">${r.total}</td>
        <td class="num">${mvHtml}</td>
      </tr>
      <tr class="detail" data-for="${esc(r.name)}" hidden><td colspan="4"><div class="picks">${picks}</div></td></tr>`;
  }).join('');

  el('p-standings').innerHTML = `
    <div class="card">
      <div class="chead">
        <span class="ctitle">Standings</span>
        <span class="cnote">${esc(poll.label)} AP Poll &middot; click a row for the team-by-team breakdown</span>
      </div>
      <div class="tblwrap"><table>
        <thead><tr><th>#</th><th>Player</th><th class="num">Points</th><th class="num">Move</th></tr></thead>
        <tbody>${body}</tbody>
      </table></div>
    </div>
    <div class="card">
      <div class="chead"><span class="ctitle">Scoring</span>

function pollByType(t){

  const preRows  = preLocked  ? standings(lastReg)   : curRows;
  const postRows = seasonDone ? standings(finalPoll) : curRows;
  const prePay   = payout(preRows,  PRE.prizes);

  const card = (title, pct, prizes, rows, pay, locked, src) => `

      ${card('Post-playoff', POST.pct, POST.prizes, postRows, postPay, seasonDone,

function chart(series){
  const box = el('chartbox');
  const W = 900, H = 400, M = {t:14, r:104, b:34, l:38};
  const iw = W - M.l - M.r, ih = H - M.t - M.b;
  const shown = series.filter(s => !HIDDEN.has(s.name));
  const all = shown.flatMap(s => s.vals);
  const maxV = Math.max(10, ...all), minV = Math.min(0, ...all);
  const hi = Math.ceil(maxV / 10) * 10 + 5;
  const lo = Math.max(0, Math.floor(minV / 10) * 10 - 5);
  const n = POLLS.length;
  const X = i => M.l + (n === 1 ? iw/2 : iw * i / (n-1));
  const Y = v => M.t + ih - ih * (v - lo) / (hi - lo || 1);

  // y ticks
  const step = (hi-lo) > 80 ? 20 : 10;
  const ticks = [];
  for(let v = Math.ceil(lo/step)*step; v <= hi; v += step) ticks.push(v);

  // x labels: thin out if crowded
  const every = n > 12 ? 2 : 1;
  const xlab = POLLS.map((p,i) => {
    if(i % every && i !== n-1) return '';
    return p.label.replace('Week ','W').replace('Final Rankings','Final').replace('Preseason','Pre');
  });

  // end labels with collision push-apart
  const ends = shown.map(s => ({name:s.name, slot:s.slot, v:s.vals[n-1], y:Y(s.vals[n-1])}))
                    .sort((a,b) => a.y - b.y);
  const GAP = 15;
  for(let i = 1; i < ends.length; i++)
    if(ends[i].y - ends[i-1].y < GAP) ends[i].y = ends[i-1].y + GAP;
  for(let i = ends.length-2; i >= 0; i--)
    if(ends[i+1].y - ends[i].y < GAP) ends[i].y = ends[i+1].y - GAP;

  const lines = shown.map(s => {
    const d = s.vals.map((v,i) => `${i?'L':'M'}${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join('');
    return `<path d="${d}" fill="none" stroke="var(--s${s.slot})" stroke-width="2"
             stroke-linejoin="round" stroke-linecap="round"/>`;
  }).join('');

  const dots = shown.map(s => s.vals.map((v,i) =>
    `<circle cx="${X(i).toFixed(1)}" cy="${Y(v).toFixed(1)}" r="3.2"
      fill="var(--s${s.slot})" stroke="var(--surface)" stroke-width="2"/>`).join('')).join('');

  box.innerHTML = `
    <svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Points by poll for each player">
      ${ticks.map(v => `
        <line x1="${M.l}" x2="${M.l+iw}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}"
              stroke="var(--grid)" stroke-width="1"/>
        <text x="${M.l-8}" y="${(Y(v)+4).toFixed(1)}" text-anchor="end"
              fill="var(--muted)" font-size="11" style="font-variant-numeric:tabular-nums">${v}</text>`).join('')}
      <line x1="${M.l}" x2="${M.l+iw}" y1="${M.t+ih}" y2="${M.t+ih}" stroke="var(--axis)" stroke-width="1"/>
      ${xlab.map((t,i) => t ? `<text x="${X(i).toFixed(1)}" y="${M.t+ih+20}" text-anchor="middle"
              fill="var(--muted)" font-size="11">${esc(t)}</text>` : '').join('')}
      <line id="cross" x1="0" x2="0" y1="${M.t}" y2="${M.t+ih}" stroke="var(--axis)" stroke-width="1" opacity="0"/>
      ${lines}${dots}
      ${ends.map(e => `<text x="${M.l+iw+9}" y="${(e.y+4).toFixed(1)}" fill="var(--s${e.slot})"
          font-size="12" font-weight="600">${esc(e.name)} <tspan fill="var(--muted)"
          style="font-variant-numeric:tabular-nums">${e.v}</tspan></text>`).join('')}
      <rect id="hit" x="${M.l}" y="${M.t}" width="${iw}" height="${ih}" fill="transparent"/>
    </svg>
    <div class="tip" id="tip"></div>`;

  const svg = box.querySelector('svg'), tip = el('tip'), cross = box.querySelector('#cross');
  const move = ev => {
    const r = svg.getBoundingClientRect();
    const px = (ev.clientX - r.left) / r.width * W;
    let i = n === 1 ? 0 : Math.round((px - M.l) / (iw / (n-1)));
    i = Math.max(0, Math.min(n-1, i));
    cross.setAttribute('x1', X(i)); cross.setAttribute('x2', X(i)); cross.setAttribute('opacity','1');
    const rows = shown.map(s => ({name:s.name, slot:s.slot, v:s.vals[i]}))
                      .sort((a,b) => b.v - a.v);
    tip.innerHTML = `<b>${esc(POLLS[i].label)}</b>` + rows.map(x =>
      `<div class="tiprow"><span class="lgsw" style="background:var(--s${x.slot})"></span>
       <span class="nm">${esc(x.name)}</span><span class="vl">${x.v}</span></div>`).join('');
    tip.style.opacity = 1;
    const bx = box.getBoundingClientRect();
    const left = (X(i) / W) * bx.width;
    tip.style.left = Math.min(Math.max(8, left + 14), bx.width - tip.offsetWidth - 8) + 'px';
    tip.style.top  = Math.max(8, (ev.clientY - bx.top) - tip.offsetHeight/2) + 'px';
  };
  svg.addEventListener('mousemove', move);
  svg.addEventListener('mouseleave', () => { tip.style.opacity = 0; cross.setAttribute('opacity','0'); });
}

function drawBoard(poll, rows){
  const owner = {};
  ROSTER.forEach(p => p.picks.forEach(id => owner[id] = p));

  const line = (rank, id, pts, isRv) => {
    const o = owner[id];
    return `<div class="brow">

          : `<span class="owner free">undrafted</span>`}

  };

  const top25 = poll.ranks.map(r => line(r.rank, r.id, pointsForRank(r.rank))).join('');
  const rv = poll.others.slice(0, 8).map((o,i) =>
    line(i < RV_SLOTS ? 'RV' + (i+1) : '&mdash;', o.id, i < RV_SLOTS ? RV_BONUS : 0)).join('');

  const scoring = new Set([...poll.ranks.map(r => r.id), ...poll.others.slice(0,RV_SLOTS).map(o => o.id)]);
  const unpicked = poll.ranks.filter(r => !owner[r.id]);

  el('p-board').innerHTML = `

          ${dead.length ? dead.map(d => `<div class="brow">
              <span class="brank">&mdash;</span>

              <span class="bpts">0</span></div>`).join('')

      </div>
    </div>`;

/* ==================================================================
   Key matchups — ranks this week's games by what they do to the pool,
   then writes the blurb from facts the API actually returns.
   ================================================================== */
const SB_URL = 'https://site.api.espn.com/apis/site/v2/sports/football/college-football/scoreboard';
const OWNER = {};
ROSTER.forEach(p => p.picks.forEach(id => OWNER[id] = p));
let GAMES = null;

const NOTE_SKIP = /^(FLEX|EARLY|LATE|TBD|AFTERNOON|NIGHT|MORNING|PRIMETIME)\b/i;
const TIERS = [[1,1,25],[2,6,20],[7,10,15],[11,15,10],[16,20,5],[21,24,3],[25,25,2]];
const tierOf = r => TIERS.find(t => r >= t[0] && r <= t[1]);
function nextDownPts(r){
  const i = TIERS.findIndex(t => r >= t[0] && r <= t[1]);
  return i < 0 ? 0 : (i + 1 < TIERS.length ? TIERS[i+1][2] : 2);
}

function parseEvent(e){
  const c = (e.competitions || [])[0]; if(!c) return null;
  const cs = c.competitors || []; if(cs.length !== 2) return null;
  const side = ha => {
    const t = cs.find(x => x.homeAway === ha) || cs[0];
    return {id:(t.team||{}).id, name:(t.team||{}).location || '',
            abbr:(t.team||{}).abbreviation || '',
            rec:((t.records||[])[0]||{}).summary || '',
            score:+(t.score||0), winner:!!t.winner};
  };
  const od = (c.odds || [])[0] || {};
  const st = (c.status || {}).type || {};
  const note = (c.notes || []).find(x => x.headline && !NOTE_SKIP.test(x.headline));
  return {id:e.id, date:e.date, timeValid:c.timeValid !== false,
          away:side('away'), home:side('home'),
          neutral:!!c.neutralSite, conf:!!c.conferenceCompetition,
          tv:(((c.broadcasts||[])[0]||{}).names||[])[0] || '',
          venue:(c.venue||{}).fullName || '',
          state:st.state || 'pre', detail:st.shortDetail || '',
          line:od.details || '', spread:(od.spread == null ? null : od.spread),
          note:note ? note.headline : ''};
}

async function loadGames(){
  const key = `appickem:${SCHEMA}:games`;
  try{
    const c = JSON.parse(localStorage.getItem(key) || 'null');
    if(c && Date.now() - c.at < 15*60*1000){ GAMES = c.g; drawMatchups(); return; }
  }catch(e){}
  try{
    const r = await fetch(SB_URL + '?groups=80&limit=300', {cache:'no-store'});
    if(!r.ok) throw 0;
    const d = await r.json();
    GAMES = {week:(d.week||{}).number || null,
             events:(d.events||[]).map(parseEvent).filter(Boolean)};
    try{ localStorage.setItem(key, JSON.stringify({at:Date.now(), g:GAMES})); }catch(e){}
  }catch(e){ GAMES = null; }
  drawMatchups();
}

/* Impact = pool points on the field, amplified by how close the game is
   and by whether two different owners are pointed at each other. */
function analyze(g, sm){
  const enrich = t => {
    const sc = sm.get(t.id);
    return Object.assign({}, t, {
      pts: sc ? sc.pts : 0,
      rank: sc && sc.kind === 'ranked' ? sc.rank : null,
      rv:   sc && sc.kind === 'rv' ? sc.rvPlace : null,
      owner: OWNER[t.id] || null});
  };
  const sides = [enrich(g.away), enrich(g.home)];
  const owned = sides.filter(s => s.owner);
  if(!owned.length) return null;
  const atRisk = owned.reduce((a,b) => a + b.pts, 0);
  const owners = new Set(owned.map(s => s.owner.name));
  const h2h = owned.length === 2 && owners.size === 2;
  const sameOwner = owned.length === 2 && owners.size === 1;
  const sp = g.spread == null ? null : Math.abs(g.spread);
  // Decay hard on lopsided lines: a 50-point favorite is not a "key matchup"
  // no matter how many pool points are standing on the field.
  //   pick'em -> 2.00 | -3 -> 1.50 | -7 -> 1.04 | -14 -> 0.62 | -25 -> 0.36 | -50 -> 0.26
  const vol = sp == null ? 1.0 : 0.25 + 1.75 * Math.exp(-sp / 9);
  // A drafted team with no points beating a ranked team is real upside —
  // but only when the line says it could actually happen.
  const upset = owned.some(s => !s.pts) && sides.some(s => s.rank) ? 8 * vol : 0;
  const impact = atRisk * vol * (h2h ? 1.8 : 1) + upset;
  return {sides, owned, atRisk, h2h, sameOwner, sp, impact};
}

const plural = n => n === 1 ? '' : 's';
function rankTag(s){ return s.rank ? 'No. ' + s.rank : s.rv ? 'RV' + s.rv : 'unranked'; }

function favorite(g, a){
  if(!g.line) return null;
  const m = g.line.match(/^\s*([A-Za-z&.'\- ]+?)\s*-\s*([\d.]+)\s*$/);
  if(!m) return null;
  const ab = m[1].trim().toUpperCase();
  const side = a.sides.find(s => (s.abbr || '').toUpperCase() === ab);
  return {side, name: side ? side.name : m[1].trim(), by: +m[2]};
}

function stakesLine(a){
  if(a.h2h){
    const [x, y] = a.owned;
    return `<em>${esc(x.owner.name)}</em>’s ${esc(x.name)} (${rankTag(x)}, ${x.pts} pt${plural(x.pts)}) `
         + `against <em>${esc(y.owner.name)}</em>’s ${esc(y.name)} (${rankTag(y)}, ${y.pts} pt${plural(y.pts)}). `
         + `${a.atRisk} pool point${plural(a.atRisk)} on the field, and one of them takes a loss.`;
  }
  if(a.sameOwner){
    const [x, y] = a.owned;
    return `<em>${esc(x.owner.name)}</em> owns both sides — ${esc(x.name)} and ${esc(y.name)} — `
         + `so this one is a hedge: the win and the loss both land in the same column.`;
  }
  const x = a.owned[0];
  const foe = a.sides.find(s => s !== x);
  return `<em>${esc(x.owner.name)}</em> has ${x.pts} point${plural(x.pts)} riding on ${esc(x.name)} `
       + `(${rankTag(x)})${foe && foe.rank ? ` against No. ${foe.rank} ${esc(foe.name)}` : ''}.`;
}

function lineSentence(g, a){
  if(!g.line) return 'No line posted yet.';
  if(/even|pick|\bpk\b/i.test(g.line)) return 'It is on the board as a pick’em.';
  const f = favorite(g, a);
  if(!f) return `The line is ${esc(g.line)}.`;
  const who = esc(f.name);
  if(f.by < 3)   return `${who} is favored by just ${f.by} — about as close to a coin flip as the board gets.`;
  if(f.by <= 7)  return `${who} is a ${f.by}-point favorite, inside one score.`;
  if(f.by <= 14) return `${who} is favored by ${f.by}.`;
  return `${who} is a heavy ${f.by}-point favorite, so the live question is the upset, not the win.`;
}

function tierSentence(a){
  const ranked = a.owned.filter(s => s.rank).sort((x, y) => x.rank - y.rank);
  if(!ranked.length){
    const up = a.owned.find(s => !s.pts);
    const foe = up && a.sides.find(s => s !== up && s.rank);
    if(up && foe) return `${esc(up.name)} is outside the poll entirely — beating a top-25 team is `
                       + `${esc(up.owner.name)}’s cleanest route to finally putting them on the board.`;
    return '';
  }
  const s = ranked[0], t = tierOf(s.rank), nx = nextDownPts(s.rank);
  if(s.rank === 1) return `${esc(s.name)} is No. 1 and worth the full 25 — for `
                        + `${esc(s.owner.name)} every result except a win is a step backward.`;
  return `${esc(s.name)} sits in the ${t[0]}–${t[1]} band worth ${t[2]}; one tier of slippage `
       + `takes ${esc(s.owner.name)} to ${nx}.`;
}

function resultSentence(a){
  const w = a.sides.find(s => s.winner), l = a.sides.find(s => !s.winner);
  if(!w || !l) return '';
  const head = `Final: ${esc(w.name)} ${w.score}, ${esc(l.name)} ${l.score}.`;
  let tail;
  if(a.h2h){
    // Both owned by different people — say who got hurt, not just who won.
    tail = `<em>${esc(w.owner.name)}</em> takes the head-to-head; `
         + (l.pts
            ? `<em>${esc(l.owner.name)}</em>’s ${esc(l.name)} (${rankTag(l)}, ${l.pts} pt${plural(l.pts)}) `
              + `is the one exposed when the poll resets.`
            : `<em>${esc(l.owner.name)}</em>’s ${esc(l.name)} had nothing on the board to lose.`);
  } else if(a.sameOwner){
    tail = `<em>${esc(w.owner.name)}</em> owned both, so it is a wash.`;
  } else if(w.owner){
    tail = `<em>${esc(w.owner.name)}</em> holds ${w.pts ? w.pts + ' point' + plural(w.pts) : 'the win'}.`;
  } else {
    tail = `<em>${esc(l.owner.name)}</em> takes the hit — ${esc(l.name)} `
         + `was worth ${l.pts} point${plural(l.pts)}.`;
  }
  return head + ' ' + tail;
}

function whenText(g){
  if(g.state === 'post') return 'Final';
  if(g.state === 'in')   return g.detail || 'Live';
  const d = new Date(g.date);
  if(isNaN(d)) return '';
  // ESPN stamps midnight UTC with timeValid:false when kickoff is still TBD —
  // don't render that as a real time.
  if(!g.timeValid) return d.toLocaleDateString(undefined, {weekday:'short', month:'numeric', day:'numeric'}) + ' · TBD';
  return d.toLocaleString(undefined, {weekday:'short', month:'numeric', day:'numeric',
                                      hour:'numeric', minute:'2-digit'});
}

/* Optional LLM column, generated in CI (see scripts/generate-commentary.mjs).
   The API key lives in GitHub Actions secrets and never reaches the browser.
   If the file is missing, stale, or malformed we silently keep the built-in text. */
let COLUMN = null;

async function loadColumn(){
  try{
    const r = await fetch('commentary.json?t=' + Date.now(), {cache:'no-store'});
    if(!r.ok) return;
    const d = await r.json();
    if(!d || !d.games || typeof d.games !== 'object') return;
    const ageDays = (Date.now() - new Date(d.generated).getTime()) / 864e5;
    if(!(ageDays >= 0 && ageDays < 8)) return;      // never show last week's takes
    COLUMN = d;
  }catch(e){ /* no column today */ }
  drawMatchups();
}

/* LLM text is escaped, then player names are re-emphasised from the known
   roster only — nothing the model writes can inject markup. */
function columnHtml(text){
  let h = esc(String(text));
  ROSTER.forEach(p => {
    const n = p.name.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    h = h.replace(new RegExp('(^|[^A-Za-z<])(' + n + ')\\b', 'g'), '$1<em>$2</em>');
  });
  return h;
}

function drawMatchups(){
  const host = el('matchups');
  if(!host) return;
  if(!GAMES || !GAMES.events.length || !POLLS.length){ host.innerHTML = ''; return; }

  const poll = POLLS[POLLS.length - 1];
  const sm = scoreMap(poll);
  const ranked = GAMES.events
    .map(g => { const a = analyze(g, sm); return a ? {g, a} : null; })
    .filter(Boolean)
    .sort((x, y) => y.a.impact - x.a.impact || new Date(x.g.date) - new Date(y.g.date));

  const top = ranked.slice(0, 3);
  if(!top.length){ host.innerHTML = ''; return; }

  // Only trust the column if it was written for the week now on screen.
  const usableColumn = !!(COLUMN && (GAMES.week == null || COLUMN.week === GAMES.week));

  const cards = top.map((m, i) => {
    const {g, a} = m;
    const done = g.state === 'post';
    const tag = a.h2h      ? '<span class="mutag h2h">Head to head</span>'
              : a.sameOwner? '<span class="mutag">Owner hedge</span>'
              : `<span class="mutag">${a.atRisk} pt${plural(a.atRisk)} exposed</span>`;
    const live = g.state === 'in' ? '<span class="mutag live">Live</span>' : '';

    const row = s => {
      const lost = done && !s.winner;
      return `<div class="mut${s.owner ? ' own' : ''}${lost ? ' lost' : ''}">
        <span class="mursk">${s.rank ? 'No.' + s.rank : s.rv ? 'RV' + s.rv : ''}</span>
        <span class="muname">${esc(s.name)}</span>
        ${s.rec && s.rec !== '0-0' ? `<span class="murec">${esc(s.rec)}</span>` : ''}
        ${s.owner
          ? `<span class="muown"><span class="swatch" style="background:var(--s${s.owner.slot})"></span>${esc(s.owner.name)}</span>`
          : '<span class="muown free">undrafted</span>'}
        ${g.state === 'pre'
          ? `<span class="mupts">${s.pts || ''}</span>`
          : `<span class="musc">${s.score}</span>`}
      </div>`;
    };

    const meta = [];
    if(g.state === 'pre' && g.line) meta.push(`<b>${esc(g.line)}</b>`);
    if(a.atRisk)  meta.push(`${a.atRisk} pool pt${plural(a.atRisk)} at stake`);
    if(g.tv)      meta.push(esc(g.tv));
    if(g.note)    meta.push(esc(g.note));
    else if(g.neutral && g.venue) meta.push(esc(g.venue));
    else if(g.conf) meta.push('Conference game');

    // Finished games always get the factual result line — the column was
    // written before kickoff and would be describing a game that's over.
    const col = (!done && usableColumn && COLUMN.games[g.id]) ? COLUMN.games[g.id] : null;
    const body = done
      ? [resultSentence(a)].filter(Boolean).join(' ')
      : col ? columnHtml(col)
            : [stakesLine(a), lineSentence(g, a), tierSentence(a)].filter(Boolean).join(' ');

    return `<div class="mu">
      <div class="muhead"><span class="murk">${i+1}</span>${tag}${live}
        <span class="muwhen">${esc(whenText(g))}</span></div>
      <div class="muteams">${row(a.sides[0])}${row(a.sides[1])}</div>
      ${meta.length ? `<div class="mumeta">${meta.join('<span style="opacity:.4">·</span>')}</div>` : ''}
      <p class="mubody">${body}</p>
    </div>`;
  }).join('');

  host.innerHTML = `
    <div class="mzhead">
      <span class="mztitle">Games that matter${GAMES.week ? ' · Week ' + GAMES.week : ''}</span>
      <span class="cnote">ranked by what they do to the standings, not by national hype${
        usableColumn ? ` &middot; column written by ${esc(COLUMN.model || 'AI')}` : ''}</span>
    </div>
    <div class="mzgrid">${cards}</div>`;
}

/* ---------- chrome ---------- */
document.querySelectorAll('.tab').forEach(t => t.onclick = () => {
  document.querySelectorAll('.tab').forEach(x => x.setAttribute('aria-selected', x === t));
  document.querySelectorAll('.panel').forEach(p => p.hidden = (p.id !== 'p-' + t.dataset.p));
});
const themeBtn = el('themeBtn');
const saved = localStorage.getItem('appickem:theme');
if(saved) document.documentElement.setAttribute('data-theme', saved);
themeBtn.onclick = () => {
  const cur = document.documentElement.getAttribute('data-theme');
  const next = cur === 'dark' ? 'light' : cur === 'light' ? 'dark'
    : (matchMedia('(prefers-color-scheme: dark)').matches ? 'light' : 'dark');
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('appickem:theme', next);
  if(POLLS.length) draw();
};

loadPolls();
loadGames();
loadColumn();
</script>
</body>
</html>
